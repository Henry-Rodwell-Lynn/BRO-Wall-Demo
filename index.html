        width: 80vw;

        overflow: hidden;

      .fade-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f3db5;
        opacity: 0;
        overflow: hidden;
        transition: opacity 3s ease-in-out;
        pointer-events: none;
        z-index: 5;

      #dotWrapper,

        top: 0;
        left: 0;

        width: 80vw;

        position: relative;
        overflow: hidden;
        margin-top: 5px;
        background: #0f3db5;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #dotCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }

        },
        {
          name: "Tokyo",
          xRatio: 0.82,

          timezoneOffset: 9,
          weather: "Clear, 27°C",
        },
        {
          name: "Singapore",
          xRatio: 0.77,
          yRatio: 0.75,
          timezoneOffset: 8,
          weather: "Humid, 30°C",
        },
        {
          name: "Manila",
          xRatio: 0.8,
          yRatio: 0.72,
          timezoneOffset: 8,
          weather: "Stormy, 29°C",
        },
      ];

      // Use a hardcoded slice range of 3 to 8, random on each transition
      let numShapes = 5;
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const coordLabel = document.getElementById("coordLabel");
      const ANIMATION_SPEED = 0.005; // Unified speed factor for all transitions
      let w, h;
      let mouse = { x: 0, y: 0 };
      let target = { x: 0, y: 0 };
      let targetOffice;
      const travelSpeed = 0.5;
      let isTraveling = false;
      let rotationOffset = 0;

      let transitionProgress = 1;
      let transitioning = false;

      let targetEdges = [];

      function setNextOfficeTarget() {
        const MAX_ATTEMPTS = 10;
        let attempt = 0;
        let candidate;
        let farEnough = false;

        while (attempt < MAX_ATTEMPTS && !farEnough) {
          candidate = offices[Math.floor(Math.random() * offices.length)];
          const dx = (candidate.xRatio * w) - mouse.x;
          const dy = (candidate.yRatio * h) - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          farEnough = dist > w * 0.25; // 25% of canvas width
          attempt++;
        }

        targetOffice = candidate;
        target.x = targetOffice.xRatio * w;
        target.y = targetOffice.yRatio * h;

        // New logic for numShapes
        let options;
        if (numShapes > 3 && numShapes < 6) {
          options = [numShapes - 1, numShapes + 1];
        } else if (numShapes === 3) {
          options = [4];
        } else if (numShapes === 6) {
          options = [5];
        }
        numShapes = options[Math.floor(Math.random() * options.length)];

        rotationOffset = Math.random() * 0.5; // Reduced from full 2π to subtle range
        isTraveling = true;
        transitioning = true;
        transitionProgress = 0;
        resize(true);
      }

      function updateMousePosition() {
        const dx = target.x - mouse.x;
        const dy = target.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Smooth movement with continuous animation
        if (dist < 1) {
          // Immediately pick a new target once close enough
          setNextOfficeTarget();
        } else {
          const moveSpeed = ANIMATION_SPEED;
          mouse.x += dx * moveSpeed;
          mouse.y += dy * moveSpeed;
        }
      }

      const edges = [];

      function resize(isUpdate = false) {
        if (!isUpdate) {
          w = canvas.width = canvas.clientWidth;
          h = canvas.height = canvas.clientHeight;
          mouse.x = w / 2;
          mouse.y = h / 2;
        }

        const center = [w / 2, h / 2];
        const radius = Math.sqrt(w * w + h * h);
        targetEdges = [];

        const prevCount = edges.length;
        const segmentAngle = (Math.PI * 2) / numShapes;

        for (let i = 0; i < numShapes; i++) {
          const targetAngle1 = rotationOffset + i * segmentAngle;
          const targetAngle2 = rotationOffset + (i + 1) * segmentAngle;

          const midAngle = (targetAngle1 + targetAngle2) / 2;
          const midX = center[0] + radius * Math.cos(midAngle);
          const midY = center[1] + radius * Math.sin(midAngle);
          const gradLength = w;
          const gx0 = midX - gradLength;
          const gy0 = midY - gradLength;
          const gx1 = midX + gradLength;
          const gy1 = midY + gradLength;

          const existing = edges[i];
          let gradient =
            existing?.gradient || ctx.createLinearGradient(gx0, gy0, gx1, gy1);
          if (!existing) {
            gradient.addColorStop(0, "#0F3DB5");
            gradient.addColorStop(1, "#2662fc");
          }

          if (existing) {
            targetEdges.push({
              angle1: existing.angle1,
              angle2: existing.angle2,
              targetAngle1,
              targetAngle2,
              gradient,
              remove: false,
              progress: 0,
            });
          } else {
            // Improved anchoring for new slices:
            const prev = edges[i - 1];
            const next = edges[i];
            let startAngle;
            if (prev && !prev.remove && next && !next.remove) {
              // Average of surrounding slices
              startAngle = (prev.angle2 + next.angle1) / 2;
            } else if (prev && !prev.remove) {
              startAngle = prev.angle2;
            } else if (next && !next.remove) {
              startAngle = next.angle1;
            } else {
              startAngle = targetAngle1;
            }
            targetEdges.push({
              angle1: startAngle,
              angle2: startAngle,
              targetAngle1: targetAngle1,
              targetAngle2: targetAngle2,
              gradient,
              remove: false,
              progress: 0,
            });
          }
        }

        // Assign left/right neighbors for exit slices
        for (let i = numShapes; i < edges.length; i++) {
          const old = edges[i];
          const leftNeighbor = edges[i - 1];
          const rightNeighbor = edges[i + 1];
          let targetAngle1 = old.angle1;
          let targetAngle2 = old.angle2;

          // Ensure exiting slices' target angles align with the target angles of their neighbors
          if (leftNeighbor && !leftNeighbor.remove) {
            targetAngle1 = leftNeighbor.targetAngle2;
          } else if (leftNeighbor && leftNeighbor.targetAngle2 !== undefined) {
            targetAngle1 = leftNeighbor.targetAngle2;
          }

          if (rightNeighbor && !rightNeighbor.remove) {
            targetAngle2 = rightNeighbor.targetAngle1;
          } else if (
            rightNeighbor &&
            rightNeighbor.targetAngle1 !== undefined
          ) {
            targetAngle2 = rightNeighbor.targetAngle1;
          }

          // Prevent degenerate slices
          if (Math.abs(targetAngle1 - targetAngle2) < 0.0001) {
            targetAngle2 = targetAngle1 + 0.0001;
          }

          targetEdges.push({
            ...old,
            targetAngle1,
            targetAngle2,
            remove: true,
            progress: 0,
            leftNeighbor,
            rightNeighbor,
          });
        }

        transitioning = true;
        transitionProgress = 0;
      }

      window.addEventListener("resize", () => resize(false));

      // Consistent delay buffer for all slices' animation pacing
      const DELAY_BUFFER = 0.025;

      function draw() {
        function angleLerp(current, target, t) {
          let diff = target - current;
          if (diff > Math.PI) diff -= 2 * Math.PI;
          if (diff < -Math.PI) diff += 2 * Math.PI;
          return current + diff * t;
        }

        if (transitionProgress === 0 && targetEdges.length) {
          // Track previous edges before update
          const previousEdges = [...edges];
          edges.length = 0;
          edges.push(...targetEdges);
          targetEdges = [];
        }

        // Interpolate all shape angles for new, old, and removing slices
        for (let i = edges.length - 1; i >= 0; i--) {
          const shape = edges[i];
          // If removing, animate exit slices clockwise, anchored to left (clockwise) neighbor
          if (shape.remove && shape.leftNeighbor && shape.rightNeighbor) {
            // Ensure exit slices animate clockwise, anchored to left (clockwise) neighbor
            shape.targetAngle1 = shape.leftNeighbor.angle2;
            shape.targetAngle2 = shape.leftNeighbor.angle2;
          }
          // Use linear interpolation for all slice angle interpolation
          let easeT = transitionProgress * 0.025;
          if (shape.remove) {
            easeT = Math.max(0, (transitionProgress - 5000) * 0.015); // slower exit easing
          }
          shape.angle1 = angleLerp(shape.angle1, shape.targetAngle1, easeT);
          shape.angle2 = angleLerp(shape.angle2, shape.targetAngle2, easeT);
        }

        if (transitioning) {
          let dx = target.x - mouse.x;
          let dy = target.y - mouse.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          // Use unified speed multiplier for all transitions
          transitionProgress = Math.min(
            1,
            transitionProgress + ANIMATION_SPEED
          );
          if (
            transitionProgress >= 1 &&
            edges.every(
              (e) =>
                Math.abs(e.angle1 - e.targetAngle1) < 0.001 &&
                Math.abs(e.angle2 - e.targetAngle2) < 0.001
            )
          ) {
            transitioning = false;
          }
        }

        updateMousePosition();
        ctx.fillStyle = "#0F3DB5";
        ctx.fillRect(0, 0, w, h);

        const center = [w / 2, h / 2];
        const radius = Math.sqrt(w * w + h * h);

        // Draw all slices with interpolated angles
        const t = transitionProgress;
        for (let i = edges.length - 1; i >= 0; i--) {
          const shape = edges[i];
          // All slices' angles are already interpolated above
          if (shape.remove) {
            ctx.globalAlpha = 1; // No fade out for exiting slices
          } else if (shape.angle1 === shape.angle2) {
            ctx.globalAlpha = t;
          } else {
            ctx.globalAlpha = 1;
          }

          // Clamp angles to prevent collapse or drift
          if (Math.abs(shape.angle1 - shape.angle2) < 0.0001) {
            shape.angle2 = shape.angle1 + 0.0001;
          }

          // Remove collapsed slices
          if (shape.remove && transitionProgress >= 1.05) {
            const diff1 = Math.abs(shape.angle1 - shape.targetAngle1);
            const diff2 = Math.abs(shape.angle2 - shape.targetAngle2);
            const leftOK =
              !shape.leftNeighbor ||
              (Math.abs(
                shape.leftNeighbor.angle1 - shape.leftNeighbor.targetAngle1
              ) < 0.001 &&
                Math.abs(
                  shape.leftNeighbor.angle2 - shape.leftNeighbor.targetAngle2
                ) < 0.001);
            const rightOK =
              !shape.rightNeighbor ||
              (Math.abs(
                shape.rightNeighbor.angle1 - shape.rightNeighbor.targetAngle1
              ) < 0.001 &&
                Math.abs(
                  shape.rightNeighbor.angle2 - shape.rightNeighbor.targetAngle2
                ) < 0.001);
            if (diff1 < 0.001 && diff2 < 0.001 && leftOK && rightOK) {
              edges.splice(i, 1);
              continue;
            }
          }
          const midAngle = (shape.angle1 + shape.angle2) / 2;
          const midX = center[0] + radius * Math.cos(midAngle);
          const midY = center[1] + radius * Math.sin(midAngle);
          const gradLength = w;
          const gx0 = midX - gradLength;
          const gy0 = midY - gradLength;
          const gx1 = midX + gradLength;
          const gy1 = midY + gradLength;
          shape.gradient = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
          shape.gradient.addColorStop(0, "#0F3DB5");
          shape.gradient.addColorStop(1, "#2662fc");
          const x1 = center[0] + radius * Math.cos(shape.angle1);
          const y1 = center[1] + radius * Math.sin(shape.angle1);
          const x2 = center[0] + radius * Math.cos(shape.angle2);
          const y2 = center[1] + radius * Math.sin(shape.angle2);
          ctx.fillStyle = shape.gradient;
          ctx.globalCompositeOperation = "source-over";
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        requestAnimationFrame(draw);
        const canvasRect = canvas.getBoundingClientRect();
        coordLabel.style.left = `${mouse.x * (canvasRect.width / w)}px`;
        coordLabel.style.top = `${mouse.y * (canvasRect.height / h)}px`;

        let showLabel = false;
        if (targetOffice) {
          const ox = targetOffice.xRatio * w;
          const oy = targetOffice.yRatio * h;
          const odist = Math.sqrt((ox - mouse.x) ** 2 + (oy - mouse.y) ** 2);
          if (odist < 80) {
            const now = new Date();
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            const localTime = new Date(
              utc + 3600000 * targetOffice.timezoneOffset
            )
              .toTimeString()
              .split(" ")[0];
            coordLabel.innerHTML = `
            <div style="font-size: 14px; font-weight: 700;">${targetOffice.name}</div>
            <div style="font-size: 12px; font-weight: 400;">${targetOffice.weather}</div>
            <div style="font-size: 10px; font-weight: 300;">${localTime}</div>
          `;
            showLabel = true;
          }
        }
        coordLabel.style.opacity = showLabel ? "1" : "0";
      }

      resize();
      setNextOfficeTarget(); // Set initial target
      draw();
