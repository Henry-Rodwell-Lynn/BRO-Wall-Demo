<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus Point Fan Shapes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    body {
      font-family: "freight-sans-pro", sans-serif;
      font-weight: 400;
      font-style: normal;
    }
    #mainContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #wrapper {
      width: 80vw;
      aspect-ratio: 8 / 3;
      position: relative;
      overflow: hidden;
    }
    .fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0F3DB5;
      opacity: 0;
      overflow: hidden;
      transition: opacity 3s ease-in-out;
      pointer-events: none;
      z-index: 5;
    }
    #dotWrapper, #wrapper {
      position: absolute;
      top: 0;
      left: 0;
    }
    #combinedContainer {
      position: relative;
      width: 80vw;
      aspect-ratio: 8 / 3;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #coordLabel {
      position: absolute;
      color: white;
      font-family: "freight-sans-pro", sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      transform: none;
    }
    #gui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      font-family: sans-serif;
      background: white;
      padding: 10px;
      border-radius: 6px;
      color: black;
    }
    #wrapper + #wrapper {
      margin-top: 5px;
    }
    #dotWrapper {
      width: 80vw;
      aspect-ratio: 8 / 3;
      position: relative;
      overflow: hidden;
      margin-top: 5px;
      background: #0F3DB5;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #dotCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <link rel="stylesheet" href="https://use.typekit.net/mgy3ngg.css">
</head>
<body>
  <div id="combinedContainer">
    <div id="wrapper">
      <canvas id="canvas"></canvas>
      <div id="coordLabel"></div>
    </div>
    <div class="fade-overlay" id="fadeOverlay"></div>
  </div>
  <script>
    const offices = [
      { name: "Phoenix", xRatio: 0.15, yRatio: 0.55, timezoneOffset: -7, weather: "Hot, 37°C" },
      { name: "El Dorado Hills", xRatio: 0.1, yRatio: 0.5, timezoneOffset: -7, weather: "Clear, 30°C" },
      { name: "Denver", xRatio: 0.18, yRatio: 0.45, timezoneOffset: -6, weather: "Sunny, 28°C" },
      { name: "South Windsor", xRatio: 0.22, yRatio: 0.35, timezoneOffset: -5, weather: "Cloudy, 22°C" },
      { name: "Andover", xRatio: 0.23, yRatio: 0.33, timezoneOffset: -5, weather: "Partly Cloudy, 20°C" },
      { name: "Boston", xRatio: 0.24, yRatio: 0.32, timezoneOffset: -5, weather: "Rainy, 18°C" },
      { name: "Kansas City", xRatio: 0.2, yRatio: 0.42, timezoneOffset: -6, weather: "Clear, 27°C" },
      { name: "Mount Laurel", xRatio: 0.25, yRatio: 0.38, timezoneOffset: -5, weather: "Sunny, 25°C" },
      { name: "Newark", xRatio: 0.26, yRatio: 0.36, timezoneOffset: -5, weather: "Cloudy, 24°C" },
      { name: "Edgewood", xRatio: 0.27, yRatio: 0.36, timezoneOffset: -5, weather: "Rainy, 21°C" },
      { name: "Lake Success", xRatio: 0.27, yRatio: 0.35, timezoneOffset: -5, weather: "Clear, 24°C" },
      { name: "New York", xRatio: 0.28, yRatio: 0.34, timezoneOffset: -5, weather: "Sunny, 25°C" },
      { name: "Pittsburgh", xRatio: 0.26, yRatio: 0.34, timezoneOffset: -5, weather: "Cloudy, 23°C" },
      { name: "Coppell", xRatio: 0.21, yRatio: 0.55, timezoneOffset: -6, weather: "Hot, 35°C" },
      { name: "Houston", xRatio: 0.22, yRatio: 0.58, timezoneOffset: -6, weather: "Humid, 33°C" },
      { name: "Markham", xRatio: 0.26, yRatio: 0.28, timezoneOffset: -5, weather: "Cool, 18°C" },
      { name: "Toronto", xRatio: 0.27, yRatio: 0.27, timezoneOffset: -5, weather: "Mild, 20°C" },
      { name: "Bristol", xRatio: 0.38, yRatio: 0.29, timezoneOffset: 0, weather: "Rainy, 17°C" },
      { name: "Edinburgh", xRatio: 0.39, yRatio: 0.26, timezoneOffset: 0, weather: "Cloudy, 16°C" },
      { name: "London", xRatio: 0.4, yRatio: 0.3, timezoneOffset: 0, weather: "Cloudy, 18°C" },
      { name: "Prague", xRatio: 0.46, yRatio: 0.29, timezoneOffset: 1, weather: "Clear, 22°C" },
      { name: "Berlin", xRatio: 0.47, yRatio: 0.28, timezoneOffset: 1, weather: "Sunny, 24°C" },
      { name: "Frankfurt", xRatio: 0.46, yRatio: 0.3, timezoneOffset: 1, weather: "Clear, 23°C" },
      { name: "Dublin", xRatio: 0.37, yRatio: 0.28, timezoneOffset: 0, weather: "Rainy, 15°C" },
      { name: "Gdansk", xRatio: 0.49, yRatio: 0.26, timezoneOffset: 1, weather: "Cloudy, 19°C" },
      { name: "Paris", xRatio: 0.43, yRatio: 0.32, timezoneOffset: 1, weather: "Sunny, 25°C" },
      { name: "Cluj", xRatio: 0.52, yRatio: 0.31, timezoneOffset: 2, weather: "Clear, 26°C" },
      { name: "Milan", xRatio: 0.45, yRatio: 0.36, timezoneOffset: 1, weather: "Hot, 30°C" },
      { name: "Stockholm", xRatio: 0.5, yRatio: 0.22, timezoneOffset: 1, weather: "Cool, 17°C" },
      { name: "Sydney", xRatio: 0.85, yRatio: 0.85, timezoneOffset: 10, weather: "Clear, 18°C" },
      { name: "Hong Kong", xRatio: 0.78, yRatio: 0.65, timezoneOffset: 8, weather: "Humid, 31°C" },
      { name: "Bangalore", xRatio: 0.72, yRatio: 0.7, timezoneOffset: 5.5, weather: "Cloudy, 28°C" },
      { name: "Hyderabad", xRatio: 0.71, yRatio: 0.7, timezoneOffset: 5.5, weather: "Sunny, 32°C" },
      { name: "Mumbai", xRatio: 0.69, yRatio: 0.66, timezoneOffset: 5.5, weather: "Rainy, 29°C" },
      { name: "Tokyo", xRatio: 0.82, yRatio: 0.58, timezoneOffset: 9, weather: "Clear, 27°C" },
      { name: "Singapore", xRatio: 0.77, yRatio: 0.75, timezoneOffset: 8, weather: "Humid, 30°C" },
      { name: "Manila", xRatio: 0.8, yRatio: 0.72, timezoneOffset: 8, weather: "Stormy, 29°C" }
    ];

    // Use a hardcoded slice range of 3 to 8, random on each transition
    let numShapes = 5;
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const coordLabel = document.getElementById("coordLabel");
let w, h;
let mouse = { x: 0, y: 0 };
let target = { x: 0, y: 0 };
let targetOffice;
const travelSpeed = 0.5;
let isHovering = false;
let isTraveling = false;
let hoverStartTime = 0;
const hoverDuration = 1000; // Quick transitions
let rotationOffset = 0;

    let transitionProgress = 1;
    let transitioning = false;

    let targetEdges = [];

    function setNextOfficeTarget() {
      targetOffice = offices[Math.floor(Math.random() * offices.length)];
      target.x = targetOffice.xRatio * w;
      target.y = targetOffice.yRatio * h;
      // Hardcoded slice range: 3 to 6
      let newNumShapes;
      do {
        newNumShapes = Math.floor(Math.random() * 4) + 3; // 3 to 6 inclusive
      } while (newNumShapes === numShapes);
      numShapes = newNumShapes;
      rotationOffset = Math.random() * 0.5; // Reduced from full 2π to subtle range
      isTraveling = true;
      transitioning = true;
      transitionProgress = 0;
      resize(true);
    }

    function updateMousePosition() {
      if (isHovering) {
        // Smoothly approach the target when hovering to avoid sudden jumps
        mouse.x += (target.x - mouse.x) * 0.2;
        mouse.y += (target.y - mouse.y) * 0.2;
        if (Date.now() - hoverStartTime > hoverDuration) {
          isHovering = false;
          setNextOfficeTarget();
        }
        return; // Don't move the mouse while hovering
      }

      // Allow traveling and animation during transitions
      if (isTraveling) {
        let dx = target.x - mouse.x;
        let dy = target.y - mouse.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 0.5) {
          isHovering = true;
          isTraveling = false;
          hoverStartTime = Date.now();
          // Let easing continue without force-snapping
        } else {
          mouse.x += dx * travelSpeed * 0.005;
          mouse.y += dy * travelSpeed * 0.005;
        }
      }
    }

    const edges = [];

    function resize(isUpdate = false) {
      if (!isUpdate) {
        w = canvas.width = canvas.clientWidth;
        h = canvas.height = canvas.clientHeight;
        mouse.x = w / 2;
        mouse.y = h / 2;
      }
      const center = [w / 2, h / 2];
      const radius = Math.sqrt(w * w + h * h);
      targetEdges = [];
      // Guarantee each slice touches at least one other slice edge (no gaps)
      const angularWidth = (Math.PI * 2) / numShapes;
      for (let i = 0; i < numShapes; i++) {
        const targetAngle1 = rotationOffset + i * angularWidth;
        const targetAngle2 = rotationOffset + (i + 1) * angularWidth;
        // Simpler, non-animated gradient logic
        const midAngle = (i + 0.5) * angularWidth + rotationOffset;
        const midX = center[0] + radius * Math.cos(midAngle);
        const midY = center[1] + radius * Math.sin(midAngle);
        const gradLength = w;
        const gx0 = midX - gradLength;
        const gy0 = midY - gradLength;
        const gx1 = midX + gradLength;
        const gy1 = midY + gradLength;
        const match = edges[i];
        let gradient;
        if (match) {
          gradient = match.gradient;
        } else {
          gradient = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
          gradient.addColorStop(0, '#0F3DB5');
          gradient.addColorStop(1, '#2662fc');
        }
        targetEdges.push({
          angle1: match ? match.angle1 : targetAngle1,
          angle2: match ? match.angle2 : targetAngle2,
          targetAngle1,
          targetAngle2,
          gradient,
          remove: false,
          prev: i - 1,
          next: i + 1
        });
        targetEdges[i].index = i;
      }
      for (let i = numShapes; i < edges.length; i++) {
        const leftover = edges[i];
        targetEdges.push({
          ...leftover,
          targetAngle1: leftover.angle1,
          targetAngle2: leftover.angle1,
          remove: true
        });
      }
      transitioning = true;
      transitionProgress = 0;
    }

    window.addEventListener("resize", () => resize(false));

    function draw() {
      function angleLerp(current, target, t) {
        let diff = target - current;
        if (diff > Math.PI) diff -= 2 * Math.PI;
        if (diff < -Math.PI) diff += 2 * Math.PI;
        return current + diff * t;
      }

      if (transitionProgress === 0 && targetEdges.length) {
        edges.length = 0;
        edges.push(...targetEdges);
        targetEdges = [];
      }

      if (transitioning) {
        let dx = target.x - mouse.x;
        let dy = target.y - mouse.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        let speedFactor = Math.min(1, 0.0005 + (dist / 3000000)); // Slower overall progress, synced with travel
        transitionProgress = Math.min(1, transitionProgress + speedFactor);
        // Keep transitioning true during travel; only end when office is reached and label fades in
        // If not traveling, not hovering, and transition is done, stop transitioning
        if (!isTraveling && !isHovering && transitionProgress === 1) transitioning = false;
      }

      updateMousePosition();
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, w, h);

      const center = [w / 2, h / 2];
      const radius = Math.sqrt(w * w + h * h);

      for (let i = edges.length - 1; i >= 0; i--) {
        const shape = edges[i];
        // Angle interpolation with unified easing and speed
        const t = (0.5 - Math.cos(Math.PI * transitionProgress) / 2);

        // Entering and exiting slices: differentiate animation direction
        const isEntering = !shape.remove;
        const isExiting = shape.remove;

        if (isEntering) {
          // Animate normally
          shape.angle1 = angleLerp(shape.angle1, shape.targetAngle1, t * 0.1);
          shape.angle2 = angleLerp(shape.angle2, shape.targetAngle2, t * 0.1);
        } else if (isExiting) {
          // Reverse direction of animation
          shape.angle1 = angleLerp(shape.angle1, shape.targetAngle2, t * 0.1);
          shape.angle2 = angleLerp(shape.angle2, shape.targetAngle1, t * 0.1);
        }

        // Remove collapsed slices
        if (shape.remove && transitionProgress >= 0.99) {
          const diff1 = Math.abs(shape.angle1 - shape.targetAngle1);
          const diff2 = Math.abs(shape.angle2 - shape.targetAngle2);
          if (diff1 < 0.001 && diff2 < 0.001) {
            edges.splice(i, 1);
            continue;
          }
        }
        // Simpler, non-animated gradient
        const midAngle = (shape.angle1 + shape.angle2) / 2;
        const midX = center[0] + radius * Math.cos(midAngle);
        const midY = center[1] + radius * Math.sin(midAngle);
        const gradLength = w;
        const gx0 = midX - gradLength;
        const gy0 = midY - gradLength;
        const gx1 = midX + gradLength;
        const gy1 = midY + gradLength;
        shape.gradient = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
        shape.gradient.addColorStop(0, '#0F3DB5');
        shape.gradient.addColorStop(1, '#2662fc');
        const x1 = center[0] + radius * Math.cos(shape.angle1);
        const y1 = center[1] + radius * Math.sin(shape.angle1);
        const x2 = center[0] + radius * Math.cos(shape.angle2);
        const y2 = center[1] + radius * Math.sin(shape.angle2);
        ctx.fillStyle = shape.gradient;
        ctx.globalCompositeOperation = "source-over";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.closePath();
        ctx.fill();
      }

      requestAnimationFrame(draw);
      // Always update position and text, fade in/out with opacity
      const canvasRect = canvas.getBoundingClientRect();
      coordLabel.style.left = `${mouse.x * (canvasRect.width / w)}px`;
      coordLabel.style.top = `${mouse.y * (canvasRect.height / h)}px`;

      // Always show label based on distance to target, not transitioning state
      let showLabel = false;
      if (targetOffice) {
        const ox = targetOffice.xRatio * w;
        const oy = targetOffice.yRatio * h;
        const odist = Math.sqrt((ox - mouse.x) ** 2 + (oy - mouse.y) ** 2);
        if (odist < 80) {
          const now = new Date();
          const utc = now.getTime() + now.getTimezoneOffset() * 60000;
          const localTime = new Date(utc + 3600000 * targetOffice.timezoneOffset)
            .toTimeString()
            .split(" ")[0];
          coordLabel.innerHTML = `
            <div style="font-size: 14px; font-weight: 700;">${targetOffice.name}</div>
            <div style="font-size: 12px; font-weight: 400;">${targetOffice.weather}</div>
            <div style="font-size: 10px; font-weight: 300;">${localTime}</div>
          `;
          showLabel = true;
        }
      }
      coordLabel.style.opacity = showLabel ? "1" : "0";
    }

    resize();
    setNextOfficeTarget(); // Set initial target
    draw();

  </script>
</body>
</html>
